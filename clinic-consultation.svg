<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="officeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1626"/>
      <stop offset="60%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#officeGrad)"/>

  <!-- Back Wall -->
  <rect x="0" y="0" width="800" height="230" fill="#111a2e"/>

  <!-- Wall Art: Medical Anatomical Chart -->
  <rect x="180" y="40" width="90" height="110" rx="4" fill="#0b111e" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="190" y="50" width="70" height="90" fill="rgba(56,189,248,0.08)"/>
  <circle cx="225" cy="75" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="225" y1="90" x2="225" y2="120" stroke="#38bdf8" stroke-width="2"/>
  <line x1="210" y1="100" x2="240" y2="100" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Wall Certificate Frame -->
  <rect x="290" y="45" width="100" height="75" rx="4" fill="#0d1424" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <rect x="298" y="53" width="84" height="59" fill="rgba(245,158,11,0.06)"/>
  <circle cx="340" cy="72" r="10" fill="rgba(245,158,11,0.3)"/>
  <line x1="310" y1="92" x2="370" y2="92" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Examination Bed / Couch (Right) -->
  <rect x="520" y="190" width="220" height="50" rx="8" fill="#1e293b" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <!-- Bed Pillow -->
  <rect x="530" y="180" width="45" height="18" rx="6" fill="#334155" stroke="rgba(255,255,255,0.1)"/>
  <!-- Bed Paper Roll / Liner -->
  <rect x="580" y="193" width="150" height="6" rx="2" fill="#e2e8f0" opacity="0.8"/>
  <!-- Bed Legs -->
  <rect x="540" y="240" width="8" height="60" fill="#475569"/>
  <rect x="710" y="240" width="8" height="60" fill="#475569"/>
  <line x1="535" y1="300" x2="720" y2="300" stroke="#475569" stroke-width="3"/>

  <!-- Floor -->
  <polygon points="0,230 800,230 800,360 0,360" fill="#080d18"/>
  <line x1="0" y1="230" x2="800" y2="230" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Doctor Consultation Desk (Center-Left) -->
  <rect x="140" y="200" width="260" height="20" rx="4" fill="url(#deskGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Desk Base -->
  <rect x="160" y="220" width="220" height="90" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Doctor Leather Executive Chair (Behind Desk) -->
  <path d="M 230 140 Q 270 135 310 140 L 315 200 L 225 200 Z" fill="#0f172a" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <rect x="245" y="130" width="50" height="12" rx="4" fill="#1e293b"/>

  <!-- Equipment on Desk: Laptop & Stethoscope Graphic -->
  <rect x="235" y="170" width="60" height="30" rx="3" fill="#090e17" stroke="#38bdf8" stroke-width="1"/>
  <rect x="238" y="173" width="54" height="22" fill="#0284c7" opacity="0.3"/>
  <polygon points="230,200 300,200 295,203 235,203" fill="#475569"/>

  <!-- Blood Pressure Monitor / Sphygmomanometer -->
  <rect x="330" y="180" width="22" height="20" rx="3" fill="#334155"/>
  <circle cx="341" cy="190" r="6" fill="#0f172a" stroke="#6ee7b7" stroke-width="1"/>

  <!-- Patient Consultation Chair (Front of Desk) -->
  <rect x="100" y="240" width="45" height="40" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.15)"/>
  <rect x="105" y="225" width="35" height="18" rx="4" fill="#334155"/>

  <!-- Photo Tag -->
  <rect x="20" y="20" width="165" height="26" rx="6" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.15)"/>
  <text x="102" y="37" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">🩺 DOCTOR CHAMBER</text>
</svg>
