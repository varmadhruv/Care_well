<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.25)"/>
      <stop offset="100%" stop-color="rgba(2,132,199,0.12)"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a2040"/>
      <stop offset="100%" stop-color="#9b2d52"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#skyGrad)"/>

  <!-- Pavement / Plaza -->
  <polygon points="0,290 800,290 800,360 0,360" fill="#090d16"/>
  <line x1="0" y1="290" x2="800" y2="290" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Modern Multi-Story Clinic Building Main Structure -->
  <rect x="140" y="40" width="520" height="250" fill="#131b2e" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Architectural Top Signage Fascia -->
  <rect x="120" y="30" width="560" height="35" rx="6" fill="#0d1424" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <rect x="150" y="38" width="18" height="18" rx="4" fill="#38bdf8"/>
  <path d="M 159 42 L 159 52 M 154 47 L 164 47" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="180" y="53" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" letter-spacing="1">CAREWELL SPECIALIST CLINIC &amp; RESEARCH</text>

  <!-- Large Glass Curtain Walls (3 Floors) -->
  <!-- Floor 3 -->
  <g fill="url(#glassWall)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5">
    <rect x="160" y="80" width="110" height="50" rx="4"/>
    <rect x="290" y="80" width="110" height="50" rx="4"/>
    <rect x="420" y="80" width="110" height="50" rx="4"/>
    <rect x="550" y="80" width="90" height="50" rx="4"/>
  </g>

  <!-- Floor 2 -->
  <g fill="url(#glassWall)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5">
    <rect x="160" y="145" width="110" height="50" rx="4"/>
    <rect x="290" y="145" width="110" height="50" rx="4"/>
    <rect x="420" y="145" width="110" height="50" rx="4"/>
    <rect x="550" y="145" width="90" height="50" rx="4"/>
  </g>

  <!-- Ground Floor Entrance & Canopy -->
  <polygon points="260,205 540,205 560,215 240,215" fill="url(#canopy)" stroke="rgba(249,168,184,0.4)" stroke-width="1"/>
  <!-- Sliding Glass Double Doors -->
  <rect x="340" y="215" width="120" height="75" fill="rgba(56,189,248,0.18)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <line x1="400" y1="215" x2="400" y2="290" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <!-- Door Handles -->
  <line x1="395" y1="245" x2="395" y2="265" stroke="#38bdf8" stroke-width="2"/>
  <line x1="405" y1="245" x2="405" y2="265" stroke="#38bdf8" stroke-width="2"/>

  <!-- Left & Right Ground Windows -->
  <rect x="160" y="215" width="160" height="75" fill="url(#glassWall)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
  <rect x="480" y="215" width="160" height="75" fill="url(#glassWall)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>

  <!-- Subtle Interior Lighting Silhouette -->
  <text x="240" y="258" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="'Inter', sans-serif" font-size="11">CONSULTATION</text>
  <text x="560" y="258" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="'Inter', sans-serif" font-size="11">DIAGNOSTICS</text>

  <!-- Entrance Accent Glow -->
  <circle cx="400" cy="205" r="3" fill="#f9a8b8"/>
  <circle cx="340" cy="205" r="2" fill="#38bdf8"/>
  <circle cx="460" cy="205" r="2" fill="#38bdf8"/>

  <!-- Clinic Exterior Landscape Plants -->
  <path d="M 80 290 Q 100 240 120 290 Z" fill="#047857"/>
  <path d="M 680 290 Q 700 240 720 290 Z" fill="#047857"/>
  <path d="M 710 290 Q 725 250 740 290 Z" fill="#059669"/>

  <!-- Photo Tag -->
  <rect x="20" y="20" width="130" height="26" rx="6" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.15)"/>
  <text x="85" y="37" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">🏥 CLINIC FACADE</text>
</svg>
