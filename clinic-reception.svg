<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="roomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#roomGrad)"/>

  <!-- Back Wall Paneling -->
  <rect x="0" y="0" width="800" height="230" fill="#131b2e"/>
  <!-- Decorative Vertical Wooden/Acoustic Slats -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="3">
    <line x1="80" y1="0" x2="80" y2="230"/>
    <line x1="120" y1="0" x2="120" y2="230"/>
    <line x1="160" y1="0" x2="160" y2="230"/>
    <line x1="200" y1="0" x2="200" y2="230"/>
    <line x1="600" y1="0" x2="600" y2="230"/>
    <line x1="640" y1="0" x2="640" y2="230"/>
    <line x1="680" y1="0" x2="680" y2="230"/>
    <line x1="720" y1="0" x2="720" y2="230"/>
  </g>

  <!-- Polished Marble Floor -->
  <polygon points="0,230 800,230 800,360 0,360" fill="#0b101d"/>
  <line x1="0" y1="230" x2="800" y2="230" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Back Wall Clinic Logo Sign -->
  <rect x="280" y="35" width="240" height="60" rx="12" fill="rgba(10,16,30,0.8)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <circle cx="315" cy="65" r="15" fill="rgba(2,132,199,0.3)" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 315 57 L 315 73 M 307 65 L 323 65" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="340" y="62" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">CareWell Clinic</text>
  <text x="340" y="77" fill="rgba(255,255,255,0.5)" font-family="'Inter', sans-serif" font-size="9" font-weight="600">RECEPTION &amp; LOUNGE</text>

  <!-- Ambient Ceiling Recessed Lighting Strip -->
  <rect x="180" y="10" width="440" height="4" rx="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Curved Reception Counter -->
  <path d="M 200 240 Q 400 210 600 240 L 630 330 Q 400 350 170 330 Z" fill="url(#counterGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- Under-counter LED Light Strip -->
  <path d="M 175 328 Q 400 348 625 328" stroke="url(#glowCyan)" stroke-width="4" fill="none"/>
  <!-- Counter Top Surface -->
  <ellipse cx="400" cy="235" rx="200" ry="15" fill="#475569" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Desktop Monitor on Counter -->
  <rect x="365" y="185" width="70" height="42" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="370" y="190" width="60" height="32" fill="#0284c7" opacity="0.4"/>
  <rect x="395" y="227" width="10" height="10" fill="#334155"/>
  <rect x="385" y="237" width="30" height="3" rx="1.5" fill="#64748b"/>

  <!-- Waiting Area Lounge Chairs (Left) -->
  <rect x="40" y="190" width="80" height="60" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
  <rect x="35" y="235" width="90" height="35" rx="6" fill="#334155"/>

  <!-- Indoor Botanical Plant (Right) -->
  <path d="M 720 220 Q 700 170 680 160 Q 720 180 720 220" fill="#10b981"/>
  <path d="M 725 220 Q 740 160 760 150 Q 735 180 725 220" fill="#059669"/>
  <path d="M 722 220 Q 722 140 710 130 Q 725 160 722 220" fill="#34d399"/>
  <polygon points="705,220 740,220 735,260 710,260" fill="#475569"/>

  <!-- Photo Tag -->
  <rect x="20" y="20" width="150" height="26" rx="6" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.15)"/>
  <text x="95" y="37" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">🛋️ RECEPTION LOUNGE</text>
</svg>
