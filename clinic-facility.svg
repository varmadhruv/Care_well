<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="facGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="50%" stop-color="#141f33"/>
      <stop offset="100%" stop-color="#090f1a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#facGrad)"/>

  <!-- Sterile Clinical Wall -->
  <rect x="0" y="0" width="800" height="235" fill="#111c2e"/>
  
  <!-- Horizontal Sterile Stainless Steel Guide Rails -->
  <line x1="0" y1="130" x2="800" y2="130" stroke="rgba(56,189,248,0.25)" stroke-width="2"/>
  <line x1="0" y1="145" x2="800" y2="145" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Floor -->
  <polygon points="0,235 800,235 800,360 0,360" fill="#090f1b"/>
  <line x1="0" y1="235" x2="800" y2="235" stroke="rgba(56,189,248,0.3)" stroke-width="2"/>

  <!-- Advanced Patient Vital Monitor Station (Left) -->
  <rect x="120" y="100" width="110" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="128" y="108" width="94" height="69" fill="#021427"/>
  <!-- ECG / Waveform Display -->
  <path d="M 132 142 L 155 142 L 160 125 L 165 155 L 170 135 L 175 142 L 218 142" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <text x="135" y="122" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">HR 72</text>
  <text x="185" y="122" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700">SpO2 99</text>
  <!-- Monitor Stand -->
  <rect x="170" y="185" width="10" height="110" fill="#475569"/>
  <polygon points="150,295 200,295 195,310 155,310" fill="#334155"/>

  <!-- IV Infusion Stand -->
  <line x1="265" y1="60" x2="265" y2="300" stroke="#94a3b8" stroke-width="3"/>
  <path d="M 250 65 Q 265 60 265 75 Q 265 60 280 65" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="250" y="75" width="12" height="28" rx="3" fill="rgba(56,189,248,0.3)" stroke="#38bdf8"/>
  <rect x="268" y="75" width="12" height="28" rx="3" fill="rgba(56,189,248,0.3)" stroke="#38bdf8"/>
  <circle cx="265" cy="300" r="14" fill="none" stroke="#475569" stroke-width="3"/>

  <!-- Central Sanitized Treatment Table / Bed -->
  <rect x="340" y="195" width="300" height="45" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <rect x="330" y="190" width="55" height="20" rx="6" fill="#334155"/>
  <!-- Bed Legs & Mechanism -->
  <rect x="360" y="240" width="12" height="65" fill="#475569"/>
  <rect x="610" y="240" width="12" height="65" fill="#475569"/>
  <line x1="350" y1="305" x2="630" y2="305" stroke="#475569" stroke-width="4"/>

  <!-- Overhead Surgical / Examination Lamp Arm -->
  <path d="M 460 20 L 490 80 L 520 80" fill="none" stroke="#64748b" stroke-width="4"/>
  <ellipse cx="525" cy="88" rx="35" ry="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="505,100 545,100 580,200 470,200" fill="rgba(56,189,248,0.06)"/>

  <!-- Stainless Steel Diagnostic Utility Cart (Right) -->
  <rect x="670" y="210" width="70" height="90" rx="4" fill="#334155" stroke="rgba(255,255,255,0.2)"/>
  <line x1="670" y1="240" x2="740" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="670" y1="270" x2="740" y2="270" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="680" cy="305" r="5" fill="#1e293b"/>
  <circle cx="730" cy="305" r="5" fill="#1e293b"/>

  <!-- Photo Tag -->
  <rect x="20" y="20" width="165" height="26" rx="6" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.15)"/>
  <text x="102" y="37" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">🔬 TREATMENT FACILITY</text>
</svg>
