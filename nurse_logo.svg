<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>

    <!-- Glass & Glow Overlay -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#db2777" flood-opacity="0.45"/>
    </filter>

    <filter id="glowCross" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Badge with Shadow -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>

  <!-- Glass Inner Highlight -->
  <rect x="12" y="12" width="96" height="96" rx="26" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Nurse Cap Element -->
  <g transform="translate(60, 42)">
    <!-- Cap Base Arc -->
    <path d="M -26 6 Q 0 -14 26 6 L 21 16 Q 0 4 -21 16 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M -26 6 Q 0 -14 26 6" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    <!-- Tiny Medical Red/Pink Cross on Nurse Cap -->
    <rect x="-2" y="-4" width="4" height="12" rx="1.5" fill="#db2777"/>
    <rect x="-6" y="0" width="12" height="4" rx="1.5" fill="#db2777"/>
  </g>

  <!-- Central Bold Clinical Cross with Glow -->
  <g transform="translate(60, 68)" filter="url(#glowCross)">
    <!-- Vertical Bar -->
    <rect x="-8" y="-24" width="16" height="48" rx="6" fill="url(#crossGrad)"/>
    <!-- Horizontal Bar -->
    <rect x="-24" y="-8" width="48" height="16" rx="6" fill="url(#crossGrad)"/>
    <!-- Inner Heart Accent -->
    <circle cx="0" cy="0" r="4.5" fill="#f43f5e"/>
  </g>

  <!-- Stethoscope Ring Silhouette -->
  <path d="M 32 64 C 30 84 46 96 60 96 C 74 96 90 84 88 64" fill="none" stroke="#fbcfe8" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="32" cy="62" r="3" fill="#ffffff"/>
  <circle cx="88" cy="62" r="3" fill="#ffffff"/>

  <!-- Sparkle Accent Top Right -->
  <path d="M 86 28 Q 86 33 91 33 Q 86 33 86 38 Q 86 33 81 33 Q 86 33 86 28 Z" fill="#ffffff" opacity="0.9"/>
</svg>

